<!DOCTYPE html>
<html lang=es>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content="width=device-width, initial-scale=1.0">
    <title>P.R.O.Y.E.C.T.O.</title>
    <link rel=icon type=image/x-icon href=Images/tiempo.png>
    <link rel=stylesheet href=index.css>
    <meta name=keywords content=P.R.O.Y.E.C.T.O.>
    <meta name=description content=P.R.O.Y.E.C.T.O.>
    <meta name=author content=Soyo>

    <style>
        #control-volumen {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 18px;
        }

        #botones-musica {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .boton-audio {
            width: 42px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid white;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .boton-audio:hover {
            background: #444;
        }

        .boton-audio:focus-visible,
        #volumen-musica:focus-visible {
            outline: 2px solid white;
            outline-offset: 3px;
        }

        #icono-volumen {
            color: white;
            font-size: 18px;
        }

        #barra-volumen {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #volumen-musica {
            width: 110px;
            cursor: pointer;
        }

        #countdown {
            font-size: 1.5rem;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <audio id=musica-fondo loop preload=auto>
        <source src="Images/C418- BlindSpots.mp3" type=audio/mpeg>
    </audio>

    <div id=control-volumen>

        <div id=botones-musica>
            <button
                class=boton-audio
                id=boton-reproducir
                type=button
                aria-label="Reproducir música"
                title="Reproducir">
                ▶
            </button>

            <button
                class=boton-audio
                id=boton-pausar
                type=button
                aria-label="Pausar música"
                title="Pausar">
                ⏸
            </button>
        </div>

        <div id=barra-volumen>
            <span id=icono-volumen aria-hidden=true>🔉</span>

            <input
                type=range
                id=volumen-musica
                min=0
                max=100
                value=30
                aria-label="Volumen de la música">
        </div>

    </div>

    <h1>P.R.O.Y.E.C.T.O.</h1>
    <p>Ya queda poco</p>
    <div id=countdown></div>

    <script>
        const musica = document.getElementById('musica-fondo');
        const volumen = document.getElementById('volumen-musica');
        const iconoVolumen = document.getElementById('icono-volumen');
        const botonReproducir = document.getElementById('boton-reproducir');
        const botonPausar = document.getElementById('boton-pausar');

        musica.volume = 0.3;

        function actualizarIconoVolumen() {
            if (musica.muted || musica.volume === 0) {
                iconoVolumen.textContent = '🔇';
            } else if (musica.volume < 0.5) {
                iconoVolumen.textContent = '🔉';
            } else {
                iconoVolumen.textContent = '🔊';
            }
        }

        botonReproducir.addEventListener('click', async function () {
            try {
                await musica.play();
            } catch (error) {
                console.error('No se pudo reproducir el audio:', error);
            }
        });

        botonPausar.addEventListener('click', function () {
            musica.pause();
        });

        volumen.addEventListener('input', function () {
            musica.volume = Number(volumen.value) / 100;
            musica.muted = false;
            actualizarIconoVolumen();
        });

        musica.addEventListener('volumechange', actualizarIconoVolumen);

        musica.addEventListener('error', function () {
            console.error(
                'No se pudo cargar la música. Comprueba la ruta y el nombre del archivo:',
                musica.currentSrc
            );
        });

        actualizarIconoVolumen();

        const fechaObjetivo = new Date(2026, 9, 10, 17, 0, 0).getTime();

        function actualizarCuentaAtras() {
            const diferencia = fechaObjetivo - Date.now();
            const contador = document.getElementById('countdown');

            if (diferencia <= 0) {
                contador.textContent = '¡Ha llegado el momento!';
                return;
            }

            const dias = Math.floor(diferencia / 86400000);
            const horas = Math.floor((diferencia % 86400000) / 3600000);
            const minutos = Math.floor((diferencia % 3600000) / 60000);
            const segundos = Math.floor((diferencia % 60000) / 1000);

            contador.textContent =
                dias + ' días, ' +
                horas + ' horas, ' +
                minutos + ' minutos y ' +
                segundos + ' segundos';
        }

        actualizarCuentaAtras();
        setInterval(actualizarCuentaAtras, 1000);
    </script>

</body>
</html>
